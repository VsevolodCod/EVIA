name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: evia_ci
          POSTGRES_PASSWORD: evia_ci_password
          POSTGRES_DB: evia_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U evia_ci -d evia_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements.txt
      - run: npm ci --prefix frontend
      - run: npm --prefix frontend run build
      - run: python -m pytest -q
        env:
          EVIA_TEST_PG_URL: postgresql://evia_ci:evia_ci_password@localhost:5432/evia_ci

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build

  browser:
    # The browser job runs its own app and tests. A backend unit-test failure
    # must not hide the browser result during release triage.
    needs: [frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-browser.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements-browser.txt
      - run: npm ci --prefix frontend
      - run: npm --prefix frontend run build
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest tests/browser -q
        env:
          BI_BROWSER_TESTS: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evia-mobile-verification
          path: frontend/test-results/*.png
          if-no-files-found: warn
