services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: evia_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:-evia_test_only}
    ports:
      - "55432:5432"
    volumes:
      - ./docker/postgres-test:/docker-entrypoint-initdb.d:ro
